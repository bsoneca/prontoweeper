# Hand-written, not emitted: pronto 0.13.4 emits this file only for the pages
# target (emit.cue: `if list.Contains(E.code.meta.targets, "pages")`), but
# sayt's release ceremony (release.nu) runs goreleaser for every target. This is
# the same configuration the emitter writes: goreleaser as a shim that tags,
# with builds, the GitHub release and the changelog off. Delete it once the
# emitter writes it for cloudflare releases too.
version: 2
project_name: prontoweeper
dist: dist/goreleaser
builds:
  - builder: zig
    skip: true
release:
  disable: true
changelog:
  disable: true
